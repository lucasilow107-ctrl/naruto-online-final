services:
  - type: web
    name: naruto-rpg-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: naruto-rpg-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: naruto-rpg-db
    databaseName: naruto_rpg
    user: naruto_rpg
